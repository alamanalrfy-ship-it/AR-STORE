function importSafetyCatalog(){
let addedS=0,addedP=0,skippedS=0,skippedP=0;
const idBySupIdx={};
SAFETY_CATALOG.s.forEach((row,i)=>{const[name,addr,phone,tax]=row;
 if(D.k.some(x=>x.name==name)){skippedS++;idBySupIdx[i]=(D.k.find(x=>x.name==name)||{}).id;return}
 const nid=id();D.k.push({id:nid,name,type:'s',addr,phone,tax,limit:0});idBySupIdx[i]=nid;addedS++});
SAFETY_CATALOG.p.forEach(row=>{const[name,code,cat,buy,sell,q0,mn,supIdx]=row;
 if(D.p.some(x=>x.code==code)){skippedP++;return}
 D.p.push({id:id(),name,code,cat,buy,sell,q0,min:mn,sup:idBySupIdx[supIdx]||''});addedP++});
save();render();
toast(`تم إضافة ${addedP} صنفًا و ${addedS} موردًا`+((skippedP||skippedS)?` (تم تخطي ${skippedP+skippedS} موجودين مسبقًا)`:''));
}
const genCode=()=>{let n=(D.n.prod||0)+1,c;do{c='P'+String(n).padStart(5,'0');n++}while(D.p.some(x=>x.code==c));D.n.prod=n-1;return c};
function ep(i){const p=D.p.find(x=>x.id==i)||{};form(i?'تعديل منتج':'إضافة منتج',[['name','الاسم','text',0,p.name],['code','الكود / الباركود (فارغ = توليد تلقائي)','text',0,p.code||(i?'':genCode())],['cat','التصنيف','text',0,p.cat],['buy','سعر الشراء','number',0,p.buy],['sell','سعر البيع','number',0,p.sell],['q0','الكمية الافتتاحية','number',0,p.q0||0],['min','حد إعادة الطلب','number',0,p.min??3],['sup','المورد','sel',[['','—'],...D.s.map(s=>[s.id,s.name])],p.sup]],o=>{if(!o.name){toast('الاسم مطلوب');return false}if(!o.code)o.code=genCode();if(D.p.some(x=>x.code==o.code&&x.id!=i)){toast('هذا الكود مستخدم لمنتج آخر');return false}if(i)Object.assign(p,o);else D.p.push({id:id(),...o})})}

void:['الفواتير الملغاة',()=>[['الرقم','النوع','التاريخ','الإجمالي','السبب','ألغاها'],D.vd.map(d=>[d.no,T[d.t],d.date,fm(d.total),esc(d.vr),esc(d.vb)])]]});
/* USERS */
V.users=()=>`<div class="row"><button class="p" onclick="nu()">➕ مستخدم</button></div><div class="c">${tbl(['المستخدم','الدور','كلمة المرور','الصلاحيات',''],D.u.map(u=>[esc(u.name),RL[u.role],u.h?'✔ محددة':'<span class=bad>لم تُحدد</span>',ACC[u.role]=='all'?'كل الأقسام'+(u.role=='admin'?' + المستخدمون':''):ACC[u.role].map(x=>NAV.find(n=>n[0]==x)[1]).join('، '),`<button onclick="rp('${u.id}')">🔑 إعادة تعيين</button> ${u.id!=cu&&(u.role!='admin'||D.u.filter(x=>x.role=='admin').length>1)?`<button class="d" onclick="if(confirm('حذف المستخدم؟')){D.u=D.u.filter(x=>x.id!='${u.id}');save();render()}">حذف</button>`:''}`]))}</div>
<div class="c"><h2>📜 سجل النشاط</h2>${tbl(['الوقت','المستخدم','العملية'],[...D.log].reverse().slice(0,40).map(l=>[l.t,esc(l.u),esc(l.a)]))}</div>
<div class="c"><h2>🔐 نسخ احتياطي واستعادة</h2><p>البيانات تُحفظ في متصفح هذا الجهاز فقط. انسخ النص واحفظه في ملف للنسخ الاحتياطي (يتضمن بصمات كلمات المرور فاحفظه بعناية)، أو الصق نسخة سابقة ثم اضغط استعادة.</p><textarea id="bk" style="width:100%;height:110px">${esc(JSON.stringify(D))}</textarea><p><button class="p" onclick="try{D=JSON.parse($('#bk').value);mk();save();applySt();out()}catch(e){toast('نص غير صالح')}">استعادة</button> <button class="d" onclick="if(confirm('مسح كل البيانات التشغيلية؟ (المستخدمون يبقون)')){D={...seed(),p:[],c:[],s:[],b:[],u:D.u,log:D.log,st:D.st};mk();save();render()}">مسح البيانات</button></p></div>`;
const pr=()=>{const[h,r]=RP[rep][1]();mo(`<h2>${RP[rep][0]} ${r1?'من '+r1:''} ${r2?'إلى '+r2:''}</h2>`+tbl(h,r)+`<p class="noprint"><button class="p" onclick="print()">🖨️ طباعة</button> <button onclick="mc()">إغلاق</button></p>`)};
/* LOGIN */
async function hs(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}
const alog=(a,u)=>{D.log.push({t:new Date().toLocaleString('en-GB'),u:u||me().name,a});if(D.log.length>300)D.log.shift();save()};
const pw=async(u,p)=>{u.s=id()+id();u.h=await hs(p,u.s);delete u.hf;delete u.mc};
const fcp=()=>form('اختر كلمة مرور جديدة (مطلوب للمتابعة)',[['n','كلمة المرور الجديدة (6+)','password']],async o=>{if(o.n.length<6){toast('6 أحرف على الأقل');return false}await pw(me(),o.n);alog('تغيير كلمة المرور الأولية')});
function lgn(){mc();$('#main').innerHTML='';$('#nav').innerHTML='';$('#lo').innerHTML=`<div class="lc"><h1>${D.st.logo?`<img src="${D.st.logo}" style="max-height:56px;width:auto;margin:0 0 8px">`:'🏢 '}${esc(cn())}</h1><p style="color:var(--mut);margin:0 0 12px">سجّل الدخول للمتابعة</p><label>المستخدم</label><select id="lu" onchange="lgn2()">${D.u.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><div id="lf"></div><p id="le" class="bad"></p></div>`;lgn2()}
function lgn2(){const u=D.u.find(x=>x.id==$('#lu').value),k='onkeydown="event.key==\'Enter\'&&dl()"';$('#lf').innerHTML=u.h?`<label>كلمة المرور</label><input id="lp" type="password" ${k}><button class="p" onclick="dl()">دخول</button>`:`<p style="font-size:12px">أول دخول لهذا الحساب: اختر كلمة مرور (6 أحرف على الأقل)</p><input id="lp" type="password" placeholder="كلمة المرور"><input id="lp2" type="password" placeholder="تأكيد كلمة المرور" ${k}><button class="p" onclick="dl()">حفظ ودخول</button>`;$('#le').textContent=''}
async function dl(){const u=D.u.find(x=>x.id==$('#lu').value),p=$('#lp').value,e=$('#le');
if(Date.now()<lock)return e.textContent='محاولات كثيرة، انتظر 30 ثانية';
if(!u.h){if(p.length<6)return e.textContent='كلمة المرور 6 أحرف على الأقل';if(p!=$('#lp2').value)return e.textContent='التأكيد غير مطابق';await pw(u,p)}
else if(![u.h,u.hf].includes(await hs(p,u.s))){alog('محاولة دخول فاشلة',u.name);if(++fails>=5){lock=Date.now()+3e4;fails=0}return e.textContent='كلمة المرور غير صحيحة'}
cu=u.id;fails=0;try{sessionStorage.setItem('amn_s',cu)}catch(x){}$('#lo').innerHTML='';alog('تسجيل دخول');go('dash')}
function out(){if(cu)alog('تسجيل خروج');cu='';try{sessionStorage.removeItem('amn_s')}catch(e){}lgn()}
const cp=()=>form('تغيير كلمة المرور',[['o','الحالية','password'],['n','الجديدة (6+)','password']],async o=>{const u=me();if(await hs(o.o,u.s)!=u.h){toast('كلمة المرور الحالية خاطئة');return false}if(o.n.length<6){toast('6 أحرف على الأقل');return false}await pw(u,o.n);alog('تغيير كلمة المرور')});
const rp=i=>form('كلمة مرور جديدة',[['n','كلمة المرور (6+)','password']],async o=>{if(o.n.length<6){toast('6 أحرف على الأقل');return false}const u=D.u.find(x=>x.id==i);await pw(u,o.n);alog('إعادة تعيين كلمة مرور '+u.name)});
const nu=()=>form('مستخدم جديد',[['name','الاسم','text'],['role','الدور','sel',Object.entries(RL)],['pw','كلمة المرور (6+)','password']],async o=>{if(!o.name||o.pw.length<6){toast('الاسم مطلوب وكلمة المرور 6 أحرف على الأقل');return false}const u={id:id(),name:o.name,role:o.role};await pw(u,o.pw);D.u.push(u);alog('إضافة مستخدم '+o.name)});
mk();applySt();try{cu=sessionStorage.getItem('amn_s')||''}catch(e){}if(!D.u.some(u=>u.id==cu))cu='';
addEventListener('click',()=>idle=Date.now());addEventListener('keydown',()=>idle=Date.now());setInterval(()=>{if(cu&&Date.now()-idle>6e5){out();toast('انتهت الجلسة لعدم النشاط')}},3e4);
cu?render():lgn();
</script></body></html>
